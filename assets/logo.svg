<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <g transform="translate(4, 8)">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <radialGradient id="ck-dough" cx="35%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FCE3BF"/>
      <stop offset="35%" stop-color="#EDB87D"/>
      <stop offset="75%" stop-color="#CF853F"/>
      <stop offset="100%" stop-color="#995117"/>
    </radialGradient>
    <linearGradient id="ck-chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E3125"/>
      <stop offset="70%" stop-color="#381A12"/>
      <stop offset="100%" stop-color="#1F0C07"/>
    </linearGradient>
    <linearGradient id="ck-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6CC"/>
      <stop offset="50%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#E88C30"/>
    </linearGradient>
    <filter id="ck-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#42122A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- COOKIE SILHOUETTE WITH ICONIC BITE MARK -->
  <g filter="url(#ck-shadow)">
    <path d="M24 3.5 C12.5 3.5 3.5 12.7 3.5 24 C3.5 35.3 12.5 44.5 24 44.5 C35.3 44.5 44.5 35.3 44.5 24 C44.5 22 44.1 20 43.2 18.2 
             C41.5 18.8 39.5 18 38.5 16.2 C37.5 14.5 38 12.2 39.5 11 C38.5 9.2 36.8 8 34.8 8.2 C33 8.5 31.5 7.2 31.2 5.5 C30 4.2 27.2 3.5 24 3.5 Z" 
          fill="url(#ck-dough)"/>
    <path d="M24 5 C13.5 5 5.5 13.5 5.5 24 C5.5 34.5 13.5 42.5 24 42.5 C34.5 42.5 42.5 34.5 42.5 24" 
          stroke="#7C3E10" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>
    <!-- Bite Crumb Edge -->
    <path d="M42.5 19 C40.5 19.5 38.8 18.5 37.8 16.8 C36.8 15 37.2 12.8 38.8 11.5 C37.8 9.8 36 8.8 34 9" 
          stroke="#FFE5C4" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Surface Cracks -->
    <path d="M12 15 Q15 16 17 14" stroke="#8F4F18" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
    <path d="M24 22 Q27 21 29 23" stroke="#8F4F18" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
    <path d="M26 36 Q29 35 32 37" stroke="#8F4F18" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
    <path d="M11 28 Q14 29 15 31" stroke="#8F4F18" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- DELICIOUS CHOCOLATE CHIPS (No white S!) -->
  <g filter="url(#ck-shadow)">
    <!-- Chip 1: Center-Left -->
    <path d="M13 20 C15 18.5 17.5 19.5 18 22 C18.5 24 16.5 26 14.5 25.5 C12.5 25 12 22 13 20 Z" fill="url(#ck-chip)"/>
    <path d="M14 20 C15.5 19.5 17 20 17.5 21.5" stroke="white" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    
    <!-- Chip 2: Center-Right -->
    <path d="M28 26 C30 24.5 33 25 34.2 27.5 C35 29.5 33.2 32 31 32 C28.8 32 27.2 29 28 26 Z" fill="url(#ck-chip)"/>
    <path d="M29.5 26 C31 25.5 33 26 33.5 27.5" stroke="white" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    
    <!-- Chip 3: Bottom Center -->
    <path d="M19 33 C20.5 31.5 23 32 23.8 34 C24.5 35.5 23 37.5 21 37.5 C19 37.5 18 35 19 33 Z" fill="url(#ck-chip)"/>
    <path d="M20 33 C21.2 32.5 22.5 33 23 34" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

    <!-- Chip 4: Top Center -->
    <path d="M21 13 C23 11 26 11.5 27 14 C27.8 16 26 18 24 18 C22 18 20.2 15.5 21 13 Z" fill="url(#ck-chip)"/>
    <path d="M22.5 13 C24 12 25.8 12.5 26.5 14" stroke="white" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>

    <!-- Chip 5: Far Right -->
    <path d="M35 32 C36.5 31 38.5 32 38.8 33.5 C39 35 37.5 36 36.2 35.8 C35 35.5 34.5 33.5 35 32 Z" fill="url(#ck-chip)"/>

    <!-- Chip 6: Top Left -->
    <path d="M14 10 C15.5 8.8 17.5 9.5 18 11 C18.5 12.5 16.8 13.5 15.5 13 C14 12.5 13.5 11 14 10 Z" fill="url(#ck-chip)"/>
  </g>

  <!-- MAGIC STAR SPRINKLE -->
  <g filter="url(#ck-shadow)">
    <path d="M30 7 C30 5 31 3.2 31 3.2 C31 3.2 32 5 32 7 C32 9 31 10.8 31 10.8 C31 10.8 30 9 30 7 Z" fill="url(#ck-gold)"/>
    <path d="M27.2 7 C29.2 7 31 6 31 6 C31 6 31 8 31 8 C31 8 32.8 7 34.8 7 C32.8 7 31 8 31 8 C31 8 31 10 31 10 C31 10 29.2 7 27.2 7 Z" fill="url(#ck-gold)"/>
    <circle cx="31" cy="7" r="0.9" fill="white"/>
  </g>

  <!-- Floating Crumbs -->
  <circle cx="43" cy="12" r="0.9" fill="#EDB77B"/>
  <circle cx="38" cy="5" r="0.7" fill="#EDB77B"/>
  <circle cx="45" cy="17" r="0.8" fill="#5E3125"/>
</svg>
  </g>
  <text x="64" y="37" font-family="'Fraunces', Georgia, serif" font-size="27" font-weight="900" letter-spacing="-0.5" fill="#6B2D5C">Frost<tspan font-family="Georgia, serif" font-style="italic" font-weight="400" fill="#E85A4F" dx="3" dy="0">&amp;</tspan><tspan dx="3" font-style="normal" font-weight="900" fill="#6B2D5C">Fable</tspan></text>
  <text x="65" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="800" letter-spacing="2.8" fill="#E85A4F">COOKIE ATELIER</text>
</svg>