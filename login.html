    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        :root {
            --color-primary: #E85A4F;
            --color-primary-light: #FF8C94;
            --color-primary-dark: #6B2D5C;
            --color-primary-bright: #FFD3B6;
            --color-accent: #A8E6CF;
            --color-bg-warm: #FFF5F0;
            --color-bg: #FFF5F0;
            --color-text-dark: #4A2C2A;
            --color-text: #4A2C2A;
            --color-rgb-primary: 232, 90, 79;
            --color-rgb-light: 255, 140, 148;
            --color-rgb-dark: 107, 45, 92;
            --color-rgb-bright: 255, 211, 182;
            --color-rgb-accent: 168, 230, 207;
            --color-rgb-text: 74, 44, 42;
        }

        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg-warm);
            color: var(--color-text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow-y: auto;
            padding: 2.5rem 1rem;
        }

        .dark body {
            background-color: #2A1A1F;
            color: #FFF5F0;
        }

        .dark .text-neutral-dark { color: #FFF5F0; }
        .dark input, .dark select, .dark textarea { color: #FFFFFF !important; }

        .visa-gradient-text {
            background: linear-gradient(135deg, #FFD3B6 0%, #E85A4F 50%, #6B2D5C 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dark .visa-gradient-text {
            background: linear-gradient(135deg, #FFD3B6 0%, #FF8C94 50%, #E85A4F 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Theme toggles — top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }
        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 16px;
        }

        .toggle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(var(--color-rgb-primary), 0.12);
            color: var(--color-primary);
            transition: all 0.3s ease;
            border: 1px solid rgba(var(--color-rgb-primary), 0.2);
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .dark .toggle-btn {
            background: rgba(var(--color-rgb-bright), 0.12);
            color: var(--color-primary-bright);
            border-color: rgba(var(--color-rgb-bright), 0.2);
        }

        .toggle-btn:hover {
            transform: scale(1.08);
            background: var(--color-primary);
            color: #FFFFFF;
        }

        .dark .toggle-btn:hover {
            background: var(--color-primary-bright);
            color: #2A1A1F;
        }

        /* Login Card */
        .login-card {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 2.5rem 2.2rem 2.2rem;
            box-shadow: 0 25px 50px rgba(var(--color-rgb-primary), 0.10);
            border: 1px solid rgba(var(--color-rgb-primary), 0.15);
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            transition: background-color 0.4s ease, border-color 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #E85A4F, #FFD3B6, #C9B1D9, #A8E6CF, #FF8C94);
        }

        .dark .login-card {
            background: #3D2A30;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* Input styling */
        .login-input {
            width: 100%;
            padding: 0.9rem 1.2rem 0.9rem 3rem;
            border-radius: 50px;
            border: 1.5px solid rgba(var(--color-rgb-primary), 0.15);
            background: #FFFFFF;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            color: var(--color-text-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .dark .login-input {
            background: #2A1A1F;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            color: #FFF5F0;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--color-primary-light);
            box-shadow: 0 0 0 4px rgba(var(--color-rgb-primary), 0.15);
        }

        .dark .login-input:focus {
            border-color: var(--color-primary-bright);
            box-shadow: 0 0 0 4px rgba(var(--color-rgb-bright), 0.12);
        }

        .login-input::placeholder {
            color: rgba(var(--color-text-dark), 0.4);
        }
        .dark .login-input::placeholder {
            color: rgba(255, 245, 240, 0.3);
        }

        /* Password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper .login-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--color-primary-light);
            font-size: 1rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark .toggle-password {
            color: var(--color-primary-bright);
        }

        .toggle-password:hover {
            color: var(--color-primary);
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .login-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* Primary button */
        .btn-visa {
            background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-primary) 100%);
            color: #FFFFFF;
            font-weight: 700;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-primary), 0.3);
        }

        .dark .btn-visa {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            color: #FFF5F0;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-primary), 0.4);
        }

        .btn-visa:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(var(--color-rgb-primary), 0.4);
        }

        .dark .btn-visa:hover {
            box-shadow: 0 10px 25px rgba(var(--color-rgb-primary), 0.5);
        }

        /* Social login buttons */
        .social-btn {
            flex: 1;
            padding: 0.8rem 0.5rem;
            border-radius: 50px;
            border: 1.5px solid rgba(var(--color-rgb-primary), 0.15);
            background: #FFFFFF;
            color: var(--color-text-dark);
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            white-space: nowrap;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .dark .social-btn {
            background: #2A1A1F;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            color: #FFF5F0;
        }

        .social-btn:hover {
            background: var(--color-bg-warm);
            border-color: var(--color-primary-light);
            transform: translateY(-2px);
        }

        .dark .social-btn:hover {
            background: rgba(var(--color-rgb-bright), 0.08);
            border-color: var(--color-primary-bright);
        }

        .social-btn i {
            font-size: 1.1rem;
            color: var(--color-primary-light);
        }

        .dark .social-btn i {
            color: var(--color-primary-bright);
        }

        /* Logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .brand-logo {
            background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary));
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-primary), 0.25);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .brand-logo:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .dark .brand-logo {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
        }

        .welcome-title {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.85rem;
            font-weight: 900;
            color: var(--color-text-dark);
            margin-top: 1.5rem;
            margin-bottom: 0.35rem;
            text-align: center;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .dark .welcome-title {
            color: #FFF5F0;
        }

        .welcome-subtitle {
            font-size: 0.9rem;
            color: var(--color-text-dark);
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 400;
            opacity: 0.7;
        }

        .dark .welcome-subtitle {
            color: #FFF5F0;
        }

        /* RTL adjustments */
        [dir="rtl"] .login-input {
            padding: 0.9rem 3rem 0.9rem 1.2rem;
        }
        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }
        [dir="rtl"] .fa-arrow-right {
            transform: scaleX(-1);
        }

        /* Responsive */
        @media (max-height: 650px) {
            .login-card { padding: 1.2rem 1.5rem; transform: scale(0.92); transform-origin: center; }
            .logo-center { margin-bottom: 0.5rem; }
            .welcome-title { font-size: 1.4rem; margin-top: 0.5rem; }
            .welcome-subtitle { font-size: 0.8rem; margin-bottom: 0.5rem; }
            .login-input { padding: 0.65rem 1rem 0.65rem 2.5rem; font-size: 0.85rem; }
            .btn-visa { padding: 0.65rem 1.2rem; font-size: 0.9rem; }
            .brand-logo { width: 38px; height: 38px; }
            .brand-logo svg { width: 22px; height: 22px; }
            .theme-toggle-wrapper { top: 8px; right: 8px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 0.8rem; }
        }

        @media (max-width: 380px) {
            .login-card { padding: 1.5rem 1.2rem; border-radius: 24px; }
            .welcome-title { font-size: 1.3rem; }
            .login-input { padding: 0.7rem 1rem 0.7rem 2.8rem; font-size: 0.85rem; }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper { top: 12px; right: 12px; }
            [dir="rtl"] .theme-toggle-wrapper { left: 12px; right: auto; }
        }

        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        .custom-checkbox {
            accent-color: var(--color-primary-light);
        }

        .dark .custom-checkbox {
            accent-color: var(--color-primary-bright);
        }

        a {
            transition: all 0.2s ease;
        }

        /* Background decorative glow */
        .bg-glow {
            position: fixed;
            top: -30%;
            right: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(var(--color-rgb-primary), 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dark .bg-glow {
            background: radial-gradient(circle, rgba(var(--color-rgb-primary), 0.08) 0%, transparent 70%);
        }

        .bg-glow-left {
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(var(--color-rgb-bright), 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dark .bg-glow-left {
            background: radial-gradient(circle, rgba(var(--color-rgb-bright), 0.06) 0%, transparent 70%);
        }
    </style>
</head>

                <p class="welcome-subtitle">Sign in to your cookie account</p>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" class="space-y-5" action="account.html" method="GET">

                <!-- Email field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-coral input-icon">
                        <i class="fas fa-envelope w-5 text-sm"></i>
                    </span>
                    <input type="email" name="email" id="login-email" placeholder="Email address" required
                        class="login-input text-sm md:text-base">
                </div>

                <!-- Password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-coral input-icon">
                        <i class="fas fa-lock w-5 text-sm"></i>
                    </span>
                    <input type="password" id="login-password" name="password" placeholder="Password" required
                        class="login-input text-sm md:text-base">
                    <button type="button" class="toggle-password" data-target="login-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Remember + Forgot -->
                <div class="flex items-center justify-between text-xs md:text-sm">
                    <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer text-cocoa dark:text-cream/80">
                        <input type="checkbox" class="rounded border-gray-300 dark:border-gray-600 custom-checkbox" checked>
                        <span class="ml-1 rtl:mr-1">Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink"
                        class="text-cocoa dark:text-cream/80 hover:text-coral font-semibold transition hover:underline">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-visa mt-2">
                    Sign In <i class="fas fa-cookie-bite ml-2"></i>
                </button>

                <!-- Divider -->
                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-coral/15 dark:border-coral/20"></div>
                    </div>
                    <div class="relative justify-center flex text-xs">
                        <span class="bg-white dark:bg-[#3D2A30] px-4 py-0.5 text-cocoa dark:text-cream/80 rounded-full font-semibold">
                            or continue with
                        </span>
                    </div>
                </div>

            </form>

            <!-- ===== SOCIAL LOGIN BUTTONS ===== -->
            <div class="mt-4">
                <div class="grid grid-cols-2 gap-3">
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('google')">
                        <i class="fab fa-google text-base"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('apple')">
                        <i class="fab fa-apple text-base"></i>
                        <span>Apple</span>
                    </button>
                </div>
            </div>

            <!-- ===== "NOT A MEMBER? SIGN UP" LINK ===== -->
            <div class="text-center mt-6 pt-4 border-t border-dashed border-coral/15 dark:border-coral/20">
                <p class="text-sm md:text-base font-semibold text-cocoa dark:text-cream/80">
                    New to Frost &amp; Fable?
                    <a href="signup.html" class="text-coral font-bold transition ml-1 rtl:mr-1 hover:underline">
                        Create Account
                    </a>
                </p>
            </div>

        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Theme Toggle
            const themeBtn = document.getElementById('theme-toggle');
            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                const moon = themeBtn?.querySelector('.fa-moon');
                const sun = themeBtn?.querySelector('.fa-sun');
                if (isDark) { moon?.classList.add('hidden'); sun?.classList.remove('hidden'); }
                else { moon?.classList.remove('hidden'); sun?.classList.add('hidden'); }
                localStorage.setItem('ff-theme', isDark ? 'dark' : 'light');
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    setTheme(!document.documentElement.classList.contains('dark'));
                });
            }

            const savedTheme = localStorage.getItem('ff-theme');
            setTheme(savedTheme === 'dark');

            // 2. RTL Toggle
            const rtlBtn = document.getElementById('rtl-toggle');
            function setRTL(isRTL) {
                document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
                localStorage.setItem('ff-dir', isRTL ? 'rtl' : 'ltr');
            }

            const savedDir = localStorage.getItem('ff-dir');
            setRTL(savedDir === 'rtl');

            if (rtlBtn) {
                rtlBtn.addEventListener('click', () => {
                    setRTL(document.documentElement.getAttribute('dir') !== 'rtl');
                });
            }

            // 3. Password Toggle
            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    if (input) {
                        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                        input.setAttribute('type', type);
                        const icon = this.querySelector('i');
                        if (icon) {
                            icon.classList.toggle('fa-eye-slash');
                            icon.classList.toggle('fa-eye');
                        }
                    }
                });
            });

            // 4. Social login placeholder
            window.socialLogin = function(provider) {
                alert(`Sign in with ${provider} — coming soon. For now, use the demo form.`);
            };

            // 5. Demo login — redirect to account dashboard
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                window.location.href = 'account.html';
            });

            // 6. Forgot password link
            document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Password reset link will be sent to your registered email.');
            });
        });
    </script>

</body>
</html>
